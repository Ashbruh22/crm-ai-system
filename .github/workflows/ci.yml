# CI (spec section 11): lint, type-check and tests on every PR.
#
# The backend suite runs twice on purpose. SQLite is fast and is what a
# developer runs locally; PostgreSQL is what production uses, and it is the run
# that catches dialect-specific mistakes — the reason app/db/types.GUID exists
# instead of the PostgreSQL UUID type.

name: CI

on:
  push:
    branches: [main, "demo/**"]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend:
    name: backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_ai_test
          POSTGRES_USER: crm_ai
          POSTGRES_PASSWORD: crm_ai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check the artifacts the service boots from
        # A fresh clone must contain the model files. Phase 0 found a repo
        # whose service could not start because they were gitignored.
        run: |
          for f in xgb_model.json lstm.onnx feature_schema.json rep_stats.json metrics.json; do
            test -s "artifacts/$f" || { echo "missing artifacts/$f"; exit 1; }
          done
          echo "artifacts present"

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-not-for-production
          REDIS_URL: redis://localhost:6379/0
          ALLOWED_ORIGINS: http://localhost:5173
          SEED_ON_STARTUP: "false"
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          # conftest builds its engine from this, so the postgres leg really
          # exercises PostgreSQL rather than relabelling the SQLite run.
          TEST_DATABASE_URL: >-
            ${{ matrix.database == 'postgres'
              && 'postgresql+asyncpg://crm_ai:crm_ai@localhost:5432/crm_ai_test'
              || 'sqlite+aiosqlite:///:memory:' }}
        run: pytest -q

      - name: Check the migrations apply to an empty database
        if: matrix.database == 'postgres'
        env:
          SECRET_KEY: test-secret-key-not-for-production
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: postgresql+asyncpg://crm_ai:crm_ai@localhost:5432/crm_ai_test
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc -b --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build
        # VITE_API_URL is required in a production build; the client throws
        # without it rather than shipping a guessed URL.
        env:
          VITE_API_URL: https://example.invalid
        run: npm run build

  image:
    name: docker image
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build the runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: crm-ai-service:ci

      - name: Check it fits the free tier
        # The budget is ~512 MB of RAM. This guards the regression that put
        # 469 MB of CUDA runtime into a CPU-only service.
        run: |
          size_mb=$(docker image inspect crm-ai-service:ci --format '{{.Size}}' | awk '{print int($1/1024/1024)}')
          echo "image size: ${size_mb} MB"
          if [ "$size_mb" -gt 1400 ]; then
            echo "image grew past 1400 MB; check for a GPU or training dependency"
            exit 1
          fi
          if docker run --rm --entrypoint sh crm-ai-service:ci -c 'ls /opt/venv/lib/python3.12/site-packages' | grep -qi '^nvidia$'; then
            echo "CUDA libraries are in the runtime image"
            exit 1
          fi

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
