# Keep the free-tier service awake (spec section 12).
#
# Render spins the container down after ~15 minutes idle, and the next request
# then pays a 30-60 second cold start. The dashboard handles that gracefully,
# but a reviewer opening the link should not have to wait through it.
#
# Restricted to waking hours rather than running all day: a demo nobody is
# looking at overnight does not need to be warm, and GitHub Actions minutes are
# finite.

name: Keep the demo warm

on:
  schedule:
    # Every 10 minutes, 08:00-22:00 UTC.
    - cron: "*/10 8-22 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: |
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 90 \
            "${{ secrets.DEMO_API_URL }}/healthz" || echo 000)
          echo "HTTP $code"
          cat /tmp/health.json 2>/dev/null || true

          # A cold start that eventually answers is a success. Only a service
          # that never answers, or reports itself unhealthy, is a failure.
          if [ "$code" != "200" ]; then
            echo "service did not respond"
            exit 1
          fi
          grep -q '"status": *"ok"' /tmp/health.json || {
            echo "service is up but degraded"
            exit 1
          }
