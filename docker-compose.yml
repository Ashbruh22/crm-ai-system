# Local stack for the hosted demo.
#
#   docker compose up                    api + postgres + redis (what Render runs)
#   docker compose --profile proxy up    adds nginx
#   docker compose --profile mlops up    adds the Celery drift/retrain workers
#   docker compose --profile kafka up    runs the paper's Kafka ingestion path
#   docker compose --profile all up      everything
#
# The default set is deliberately the three services the hosted demo actually
# needs. nginx and Celery are behind profiles because Render runs a single web
# service and starting them by default made `docker compose up` a six-container
# affair that did not match production.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Compose-internal hostnames override whatever .env points at.
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-crm_ai_app}:${DB_PASSWORD:-crm_ai_db_password_dev}@db:5432/crm_ai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
      - ./artifacts:/app/artifacts:ro   # xgb_model.json, lstm.onnx, schema
      - ./data:/app/data:ro             # live demo set for seeding
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm_ai
      POSTGRES_USER: ${DB_USER:-crm_ai_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crm_ai_db_password_dev}
    ports:
      # Exposed so tests and psql can reach it from the host.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crm_ai_app} -d crm_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginx:
    image: nginx:alpine
    profiles: ["proxy", "all"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  celery-worker:
    build: .
    profiles: ["mlops", "all"]
    command: celery -A ml.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
      - ./ml:/app/ml:ro
      - ./artifacts:/app/artifacts:ro
      - ./data:/app/data:ro
    restart: unless-stopped

  celery-beat:
    build: .
    profiles: ["mlops", "all"]
    command: celery -A ml.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./app:/app/app:ro
      - ./ml:/app/ml:ro
      - celery_beat_data:/app/beat
    restart: unless-stopped

  # The paper's ingestion path, kept runnable (spec section 1). The hosted
  # demo uses Redis Streams; this profile exists so the Kafka adapter in
  # app/bus/kafka.py can be exercised against a real broker locally.
  kafka:
    image: bitnami/kafka:3.7
    profiles: ["kafka", "all"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka

volumes:
  postgres_data:
  redis_data:
  celery_beat_data:
  kafka_data:
